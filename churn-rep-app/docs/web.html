<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-pane rep console — ranked worklist on the left, the selected account's
   docket on the right (risk, why, history, what to do). Stacks to one pane on phones. */
:root {
  --bg: #eef1ee;          /* cellar grey, a touch of green */
  --surface: #ffffff;
  --sunk: #f6f8f6;
  --ink: #18211d;
  --muted: #5b6862;
  --line: #d9dfdb;
  --accent: #a85f00;      /* amber, like a tap handle */
  --accent-soft: #f6e7cf;
  --hi: #b8361f;  --hi-soft: #f8e1dc;
  --mid: #9a6a00; --mid-soft: #f5ebcf;
  --lo: #2f7a4f;  --lo-soft: #dcefe3;
  --bar: #9fb0a8; --bar-recent: #a85f00;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201d; --sunk: #141a17; --ink: #e5ebe8; --muted: #93a29b; --line: #2a3430;
  --accent: #f0a53a; --accent-soft: #3a2a12;
  --hi: #f08a74; --hi-soft: #3d1f19; --mid: #e6b84f; --mid-soft: #3a3016; --lo: #74c995; --lo-soft: #173326;
  --bar: #4d5d56; --bar-recent: #f0a53a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --sunk: #141a17; --ink: #e5ebe8; --muted: #93a29b; --line: #2a3430;
  --accent: #f0a53a; --accent-soft: #3a2a12;
  --hi: #f08a74; --hi-soft: #3d1f19; --mid: #e6b84f; --mid-soft: #3a3016; --lo: #74c995; --lo-soft: #173326;
  --bar: #4d5d56; --bar-recent: #f0a53a; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-inline: 16px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
  padding-block: 14px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 28px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.totals { display: flex; gap: 20px; flex-wrap: wrap; }
.total { display: grid; }
.total b { font: 600 22px/1.1 var(--font-display); }
.total small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- panes ---------- */
.panes { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; min-height: 0; padding-block: 12px 16px; }
.pane { min-height: 0; overflow: auto; }

/* worklist */
.listhead { position: sticky; top: 0; background: var(--bg); z-index: 2; display: grid; gap: 8px; padding-bottom: 8px; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tabs button { flex: 1; padding: 7px 10px; border: 0; background: var(--surface); font-weight: 600; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#q { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.count { color: var(--muted); font-size: 12px; }

.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
  width: 100%; text-align: left; padding: 9px 10px; border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: var(--radius); background: var(--surface); }
.row:hover { border-color: var(--muted); }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.row.r-hi { border-left-color: var(--hi); } .row.r-mid { border-left-color: var(--mid); } .row.r-lo { border-left-color: var(--lo); } .row.r-wb { border-left-color: var(--muted); }
.row .rk { font: 600 18px/1 var(--font-display); color: var(--muted); grid-row: span 2; }
.row .id { font: 600 17px/1.1 var(--font-display); letter-spacing: .03em; }
.row .id small { font: 400 12px var(--font-body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.row .why { grid-column: 2; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { grid-row: span 2; text-align: right; display: grid; gap: 3px; justify-items: end; }
.row .var { font: 500 12px var(--font-data); color: var(--muted); }
.done-tag { font-size: 11px; color: var(--lo); font-weight: 600; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 13px/1.5 var(--font-data); }
.p-hi { background: var(--hi-soft); color: var(--hi); } .p-mid { background: var(--mid-soft); color: var(--mid); }
.p-lo { background: var(--lo-soft); color: var(--lo); } .p-wb { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }

/* docket */
.docket { display: grid; gap: 14px; align-content: start; }
.back { display: none; justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 5px 10px; }
.dhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
.dhead h2 { margin: 0; font: 700 40px/0.95 var(--font-display); letter-spacing: .03em; }
.dhead .where { color: var(--muted); text-transform: capitalize; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); }
.tag.channel { background: var(--accent-soft); border-color: transparent; font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.stat b { font: 600 30px/1.05 var(--font-display); }
.stat span { color: var(--muted); font-size: 12px; }
.gauge { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 4px; border: 1px solid var(--line); }
.gauge i { display: block; height: 100%; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font: 600 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.reasons { display: grid; gap: 10px; }
.reason { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
.reason .pts { font: 500 13px var(--font-data); color: var(--hi); }
.reason .track { grid-column: 1 / -1; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.reason .track i { display: block; height: 100%; background: var(--hi); opacity: .8; border-radius: 4px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }

.chart svg { width: 100%; height: auto; display: block; }
.chart .b { fill: var(--bar); } .chart .b.recent { fill: var(--bar-recent); }
.chart .axis { fill: var(--muted); font: 10px var(--font-data); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .avg { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 4 3; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; font-weight: 500; text-transform: none; }
.lines { display: flex; flex-wrap: wrap; gap: 5px; }
.lines span { font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); }
.lines span.dropped { border-style: dashed; color: var(--hi); }

.complaint blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--hi); background: var(--sunk); border-radius: 0 var(--radius) var(--radius) 0; font-style: italic; }
.stars { color: var(--hi); letter-spacing: 2px; }

.action { border-color: var(--accent); }
.action .what { font: 600 20px/1.25 var(--font-display); letter-spacing: .01em; margin: 0; }
.action .offer { margin: 0; }
.action .offer b { color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }
.brief { display: grid; gap: 10px; padding: 12px 14px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius); }
.brief h4 { margin: 0; font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.brief p, .brief ol { margin: 0; }
.brief ol { padding-left: 20px; display: grid; gap: 4px; }
.brief .src { font-size: 12px; color: var(--muted); }

.empty { color: var(--muted); padding: 40px 0; text-align: center; }

@media (max-width: 860px) {
  .panes { grid-template-columns: minmax(0, 1fr); }
  .app.detail .listpane { display: none; }
  .app:not(.detail) .docketpane { display: none; }
  .back { display: inline-block; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .dhead h2 { font-size: 34px; }
  .brand p { display: none; }
  .totals { gap: 14px; }
  .total b { font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) { .gauge i, .reason .track i { transition: width .35s ease; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>Tap<span>line</span></h1>
      <p id="asof">Churn worklist</p>
    </div>
    <div class="totals" id="totals"></div>
  </header>

  <div class="panes">
    <section class="pane listpane" aria-label="Worklist">
      <div class="listhead">
        <div class="tabs" role="group" aria-label="List">
          <button type="button" id="tab-prevent" aria-pressed="true">Prevent</button>
          <button type="button" id="tab-winback" aria-pressed="false">Win back</button>
        </div>
        <input id="q" type="search" placeholder="Search account or city" autocomplete="off">
        <div class="chips" id="chips"></div>
        <div class="count" id="count"></div>
      </div>
      <ul class="rows" id="rows"></ul>
    </section>

    <section class="pane docketpane" aria-live="polite">
      <div class="docket" id="docket"></div>
    </section>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const META = DATA.meta;
const ALL = DATA.accounts;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : "R$ " + Math.round(v).toLocaleString("en-US");
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const line = s => String(s || "").replace(/_/g, " ");
const riskClass = r => r == null ? "wb" : r >= 0.40 ? "hi" : r >= 0.25 ? "mid" : "lo";
const SEG_SHORT = { "1": "Save now", "2": "Rescue cheaply", "3": "Protect", "4": "Monitor" };
const segShort = s => SEG_SHORT[(s || "")[0]] || s;

/* per-viewer "done" marks (browser only) */
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("tapline-done") || "[]")); } catch (e) {}
const saveDone = () => { try { localStorage.setItem("tapline-done", JSON.stringify([...done])); } catch (e) {} };

const state = { list: "active", seg: "all", q: "", sel: null };

/* ---------- header ---------- */
$("#asof").textContent = `Data as of 31 Aug 2018 · churn = ${META.min_orders}+ orders, then 2× its usual gap without one (90–180 days)`;
const T = META.totals;
$("#totals").innerHTML = [
  [T.active.toLocaleString("en-US"), "active accounts"],
  [money(T.value_at_risk_all_active), "revenue at risk"],
  [(T.segments["1 Save now (high risk, high value)"] || 0).toLocaleString("en-US"), "save now"],
  [T.churned.toLocaleString("en-US"), "to win back"],
].map(([b, s]) => `<div class="total"><b class="num">${b}</b><small>${s}</small></div>`).join("");

/* ---------- worklist ---------- */
function filtered() {
  const q = state.q.trim().toLowerCase();
  return ALL.filter(a => (state.list === "active" ? a.status === "active" : a.status === "churned"))
    .filter(a => state.seg === "all" || a.segment[0] === state.seg)
    .filter(a => !q || a.id.toLowerCase().includes(q) || (a.city || "").includes(q))
    .sort((a, b) => a.rank - b.rank);
}

function renderChips() {
  const el = $("#chips");
  if (state.list !== "active") { el.innerHTML = ""; return; }
  const segs = [["all", "All"], ["1", "Save now"], ["3", "Protect"], ["2", "Rescue cheaply"]];
  el.innerHTML = segs.map(([k, t]) => `<button type="button" class="chip" data-seg="${k}" aria-pressed="${state.seg === k}">${t}</button>`).join("");
}

function renderRows() {
  const items = filtered();
  $("#count").textContent = state.list === "active"
    ? `${items.length} accounts, ranked by priority (risk weighted ${META.risk_weight} vs revenue)`
    : `${items.length} churned accounts, ranked by what they used to spend`;
  $("#rows").innerHTML = items.map(a => {
    const rc = riskClass(a.risk);
    const why = a.status === "active" ? (a.reasons[0]?.text || "No single clear reason") : `Silent ${a.days_since_last} days · usually every ${Math.round(a.usual_gap_days)}`;
    const right = a.status === "active"
      ? `<span class="pill p-${rc} num">${pct(a.risk)}</span><span class="var num">${money(a.value_at_risk)}</span>`
      : `<span class="pill p-wb num">${money(a.annual_value)}/yr</span>`;
    return `<li><button type="button" class="row r-${rc}" data-id="${a.id}" aria-current="${state.sel === a.id}">
      <span class="rk num">${a.rank}</span>
      <span class="id">${a.id}<small>${esc(a.city || "")}</small></span>
      <span class="side">${right}${done.has(a.id) ? '<span class="done-tag">Done</span>' : ""}</span>
      <span class="why">${esc(why)}</span>
    </button></li>`;
  }).join("") || `<li class="empty">No accounts match.</li>`;
}

/* ---------- order history chart ---------- */
function chart(a) {
  const v = a.monthly_spend, months = META.months, W = 600, H = 170, L = 44, R = 8, Tp = 10, B = 24;
  const max = Math.max(...v, 1), nice = niceMax(max), bw = (W - L - R) / v.length;
  const y = x => Tp + (H - Tp - B) * (1 - x / nice);
  const last12 = v.slice(-12), avg = last12.reduce((s, x) => s + x, 0) / 12;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend per month, January 2017 to August 2018">`;
  for (const t of [0, nice / 2, nice]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t >= 1000 ? (t / 1000).toFixed(t % 1000 ? 1 : 0) + "k" : Math.round(t)}</text>`;
  v.forEach((x, i) => {
    const h = Math.max(0, y(0) - y(x));
    s += `<rect class="b${i >= v.length - 3 ? " recent" : ""}" x="${L + i * bw + 2}" y="${y(x)}" width="${bw - 4}" height="${h}" rx="1.5"><title>${months[i]}: ${money(x)}</title></rect>`;
    if (i % 3 === 0 || i === v.length - 1) s += `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${monthLabel(months[i])}</text>`;
  });
  if (avg > 0) s += `<line class="avg" x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}"/>`;
  return s + "</svg>";
}
function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= m) return k * p; return 10 * p; }
function monthLabel(m) { const [yy, mm] = m.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mm - 1] + " " + yy.slice(2); }

/* ---------- docket ---------- */
function renderDocket() {
  const a = ALL.find(x => x.id === state.sel);
  const el = $("#docket");
  if (!a) { el.innerHTML = `<p class="empty">Pick an account from the worklist.</p>`; return; }
  const active = a.status === "active", rc = riskClass(a.risk);
  const line = Math.min(180, Math.max(META.churn_days, Math.round(2 * a.usual_gap_days))), left = line - a.days_since_last;
  const maxPts = Math.max(...a.reasons.map(r => r.points || 0), 1);

  const stats = active ? `
    <div class="stat"><small>Churn risk: crosses its line within 90 days</small><b class="num" style="color:var(--${rc})">${pct(a.risk)}</b>
      <div class="gauge"><i style="width:${Math.round(a.risk * 100)}%;background:var(--${rc})"></i></div></div>
    <div class="stat"><small>Yearly revenue</small><b class="num">${money(a.annual_value)}</b><span>last 12 months</span></div>
    <div class="stat"><small>Value at risk</small><b class="num">${money(a.value_at_risk)}</b><span>risk × yearly revenue</span></div>
    <div class="stat"><small>Last order</small><b class="num">${a.days_since_last} days</b><span>usually every ${Math.round(a.usual_gap_days)} · ${left > 0 ? left + " days to churn line" : "past churn line"}</span></div>`
  : `
    <div class="stat"><small>Status</small><b style="color:var(--muted)">Churned</b><span>no order for ${a.days_since_last} days</span></div>
    <div class="stat"><small>Used to spend</small><b class="num">${money(a.annual_value)}</b><span>per year</span></div>
    <div class="stat"><small>Usual rhythm</small><b class="num">${Math.round(a.usual_gap_days)} days</b><span>between orders</span></div>
    <div class="stat"><small>Orders placed</small><b class="num">${a.n_orders}</b><span>since Jan 2017</span></div>`;

  const reasons = active ? `
    <div class="card"><h3>Why this account is at risk</h3>
      ${a.reasons.length ? `<div class="reasons">${a.reasons.map(r => `
        <div class="reason"><span>${esc(r.text)}</span><span class="pts num">+${r.points} pts</span>
        <span class="track"><i style="width:${Math.round(100 * r.points / maxPts)}%"></i></span></div>`).join("")}</div>
        <p class="note">A typical account has ${pct(META.typical_risk)} risk. The points show where this account's extra ${Math.round((a.risk - META.typical_risk) * 100)} points come from; account size and other factors make up the rest.</p>`
      : `<p class="note">No single fixable cause stands out. Risk comes mostly from the account's size and irregular rhythm.</p>`}
    </div>` : `
    <div class="card"><h3>What happened</h3>
      <p>This account stopped ordering ${a.days_since_last} days ago. It normally ordered every ${Math.round(a.usual_gap_days)} days.</p>
      ${a.dropped_line ? `<p class="note">Last product line it dropped: ${esc(line(a.dropped_line))}.</p>` : ""}
    </div>`;

  const c = a.complaint;
  const complaint = c ? `
    <div class="card complaint"><h3>Most recent complaint</h3>
      <div><span class="stars" aria-label="${c.score} of 5 stars">${"★".repeat(c.score)}${"☆".repeat(5 - c.score)}</span>
        <span class="note"> · ${c.days_ago} days ago · theme: ${esc(c.theme)}</span></div>
      ${c.text || c.title ? `<blockquote lang="pt">${esc([c.title, c.text].filter(Boolean).join(" — "))}</blockquote>
        <p class="note">Original Portuguese. The call brief below translates it.</p>` : `<p class="note">Low score, no comment written.</p>`}
    </div>` : "";

  const lateTxt = a.late_share == null ? "–" : Math.round(a.late_share * 100) + "% of deliveries late" + (a.last_order_late ? " (incl. the last one)" : "");
  el.innerHTML = `
    <button type="button" class="back" id="back">← Worklist</button>
    <div class="dhead">
      <div><h2>${a.id}</h2><div class="where">${esc(a.city || "Unknown city")}, ${esc(a.state || "")}</div></div>
      <div class="tags"><span class="tag">#${a.rank} ${active ? "priority" : "win-back"}</span><span class="tag">${esc(active ? segShort(a.segment) : "Win back")}</span><span class="tag channel">${esc(a.channel)}</span></div>
    </div>
    <div class="stats">${stats}</div>

    <div class="card action"><h3>Next best action</h3>
      <p class="what">${esc(a.action)}</p>
      <p class="offer">Offer: <b>${esc(a.offer)}</b>${a.dropped_line && active ? ` · win back <b>${esc(line(a.dropped_line))}</b>` : ""}</p>
      <div class="btns">
        <button type="button" class="btn primary" id="gen">Write call brief</button>
        <button type="button" class="btn" id="copy" hidden>Copy brief</button>
        <button type="button" class="btn" id="done">${done.has(a.id) ? "Mark as not done" : "Mark as contacted"}</button>
      </div>
      <div class="brief" id="brief" hidden></div>
    </div>

    <div class="grid2">
      ${reasons}
      <div class="card"><h3>Account</h3>
        <dl class="facts">
          <dt>Orders</dt><dd class="num">${a.n_orders} total · ${a.orders_last_90d ?? 0} in last 90 days${a.usual_orders_per_90d != null ? ` (usually ${a.usual_orders_per_90d.toFixed(1)})` : ""}</dd>
          <dt>Buyers</dt><dd class="num">${a.n_buyers ?? "–"} people order here</dd>
          <dt>Deliveries</dt><dd>${lateTxt}</dd>
          <dt>Delivery cost</dt><dd class="num">${a.freight_share == null ? "–" : Math.round(a.freight_share * 100) + "% of what it pays"}</dd>
          <dt>Reviews</dt><dd class="num">${a.avg_review == null ? "none yet" : a.avg_review.toFixed(1) + " / 5 average"}</dd>
          <dt>Buys most</dt><dd><div class="lines">${a.top_lines.map(l => `<span>${esc(line(l))}</span>`).join("")}${a.dropped_line ? `<span class="dropped" title="Stopped buying">${esc(line(a.dropped_line))} · stopped</span>` : ""}</div></dd>
        </dl>
      </div>
    </div>

    <div class="card chart"><h3>Spend per month</h3>
      ${chart(a)}
      <div class="legend"><span><i style="background:var(--bar-recent)"></i>last 3 months</span><span><i style="background:var(--bar)"></i>earlier</span><span><i style="background:none;border-top:2px dashed var(--ink);height:0;border-radius:0"></i>12-month average</span></div>
    </div>
    ${complaint}`;

  $("#back").onclick = () => { $("#app").classList.remove("detail"); };
  $("#done").onclick = () => { done.has(a.id) ? done.delete(a.id) : done.add(a.id); saveDone(); renderRows(); renderDocket(); };
  $("#gen").onclick = () => writeBrief(a);
  const old = briefs.get(a.id); if (old) showBrief(old);
}

/* ---------- call brief: Claude when available, a template otherwise ---------- */
const briefs = new Map();
let samplePromise = null;
const getSample = () => (samplePromise ??= (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));

function facts(a) {
  return {
    account: a.id, city: a.city, state: a.state, status: a.status,
    churn_risk: a.risk, yearly_revenue: Math.round(a.annual_value), value_at_risk: a.value_at_risk && Math.round(a.value_at_risk),
    days_since_last_order: a.days_since_last, usual_days_between_orders: Math.round(a.usual_gap_days),
    orders_last_90_days: a.orders_last_90d, usual_orders_per_90_days: a.usual_orders_per_90d,
    reasons: a.reasons.map(r => `${r.text} (+${r.points} pts)`),
    late_delivery_share: a.late_share, last_order_late: !!a.last_order_late, delivery_cost_share: a.freight_share,
    product_lines: a.top_lines.map(line), dropped_line: a.dropped_line && line(a.dropped_line),
    last_complaint: a.complaint && { stars: a.complaint.score, days_ago: a.complaint.days_ago, text_pt: [a.complaint.title, a.complaint.text].filter(Boolean).join(" — ") || null },
    recommended_action: a.action, approved_offer: a.offer, channel: a.channel,
  };
}

function prompt(a) {
  return `You prepare a sales rep at a beverage supplier for a call with a bar/shop account that may stop ordering.
Use ONLY the facts below. Do not invent discounts or promises: the only offer allowed is "approved_offer".
Product line names come from a generic catalogue; refer to them as "your <name> line".
If there is a Portuguese complaint, translate it faithfully to English.

FACTS:
${JSON.stringify(facts(a), null, 1)}

Reply with only this JSON:
{"briefing": "2-3 sentences the rep can listen to in the car: what changed, the likely reason, what to offer",
 "complaint_en": "English translation of the complaint, or null",
 "opener": "first sentence of the call, warm and specific",
 "questions": ["2-3 open questions to find out what changed"],
 "offer_pitch": "1-2 sentences pitching the approved offer",
 "close": "one sentence agreeing a concrete next step"}`;
}

function templateBrief(a) {
  const r = a.reasons.map(x => x.text.toLowerCase());
  const slow = a.status !== "active"
    ? `stopped ordering ${a.days_since_last} days ago after ordering about every ${Math.round(a.usual_gap_days)} days`
    : `has placed ${a.orders_last_90d ?? 0} order${(a.orders_last_90d ?? 0) === 1 ? "" : "s"} in the last 90 days, against a usual ${(a.usual_orders_per_90d ?? 0).toFixed(1)}`;
  return {
    briefing: `${a.id} in ${a.city || "this area"} ${slow}. ${r.length ? "Main signals: " + r.slice(0, 2).join("; ") + "." : ""} Plan: ${a.action.toLowerCase()}. Offer: ${a.offer.toLowerCase()}.`,
    complaint_en: a.complaint?.text ? "(Translation needs the AI brief.)" : null,
    opener: a.complaint ? `Hi, I'm calling because I saw your last order didn't go the way it should, and I want to make that right.`
      : `Hi, I'm checking in: we noticed we haven't seen an order from you in a while and wanted to hear how things are going.`,
    questions: [
      "How have things been going with our deliveries lately?",
      a.dropped_line ? `I noticed you stopped ordering your ${line(a.dropped_line)} line. What changed there?` : "Has anything changed in what your customers are asking for?",
      "Is there anything that would make ordering from us easier?",
    ],
    offer_pitch: `To make it worth your while: ${a.offer.toLowerCase()}.`,
    close: "Shall I put together your usual order so you can confirm it today?",
    source: "template",
  };
}

function showBrief(b) {
  const el = $("#brief"); if (!el) return;
  el.hidden = false;
  el.innerHTML = `
    <div><h4>30-second briefing</h4><p>${esc(b.briefing)}</p></div>
    ${b.complaint_en ? `<div><h4>Complaint in English</h4><p>${esc(b.complaint_en)}</p></div>` : ""}
    <div><h4>Call script</h4><ol>
      <li>${esc(b.opener)}</li>
      ${(b.questions || []).map(q => `<li>${esc(q)}</li>`).join("")}
      <li>${esc(b.offer_pitch)}</li>
      <li>${esc(b.close)}</li></ol></div>
    <p class="src">${b.source === "ai" ? "Written by Claude from this account's data. Only the approved offer is used." : "Template version. Open this page in Claude to have the brief written and the complaint translated by AI."}</p>`;
  const copy = $("#copy"); copy.hidden = false;
  copy.onclick = async () => {
    const text = [b.briefing, b.complaint_en && "Complaint: " + b.complaint_en, b.opener, ...(b.questions || []), b.offer_pitch, b.close].filter(Boolean).join("\n");
    try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Selected, press Ctrl+C"; }
    setTimeout(() => (copy.textContent = "Copy brief"), 1800);
  };
}

async function writeBrief(a) {
  const btn = $("#gen"), el = $("#brief");
  btn.disabled = true; el.hidden = false; el.innerHTML = `<p class="note">Writing the brief…</p>`;
  let b = null;
  const sample = await getSample();
  if (sample) {
    try {
      const out = await sample.json(prompt(a), { modelTier: "quick" });
      if (out && out.briefing) b = { ...out, source: "ai" };
    } catch (e) { /* not granted, offline or rate limited: fall back to the template */ }
  }
  b ??= templateBrief(a);
  briefs.set(a.id, b);
  if (state.sel === a.id) { showBrief(b); const g = $("#gen"); if (g) { g.disabled = false; g.textContent = "Write again"; } }
}

/* ---------- events ---------- */
function select(id) { state.sel = id; renderRows(); renderDocket(); $("#app").classList.add("detail"); $(".docketpane").scrollTop = 0; }
$("#rows").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) select(b.dataset.id); });
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.seg = b.dataset.seg; renderChips(); renderRows(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; renderRows(); });
function setList(l) {
  state.list = l; state.seg = "all";
  $("#tab-prevent").setAttribute("aria-pressed", l === "active"); $("#tab-winback").setAttribute("aria-pressed", l === "churned");
  renderChips(); renderRows();
  const first = filtered()[0]; state.sel = first ? first.id : null; renderRows(); renderDocket();
}
$("#tab-prevent").onclick = () => setList("active");
$("#tab-winback").onclick = () => setList("churned");

setList("active");
$("#app").classList.remove("detail");
</script>
