<title>Fieldline Rep App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone app in one column (max 440px, centred on desktop). Scrolling screen above,
   fixed bottom tab bar (Today · Next stop · Accounts). Account detail is a pushed screen. */
:root {
  --outer: #dfe7e2;
  --bg: #f4f7f5;
  --surface: #ffffff;
  --sunk: #eef3f0;
  --ink: #10221b;
  --muted: #5f7068;
  --line: #dde6e1;
  --brand-deep: #062e24;     /* bottle green */
  --brand-mid: #0a4a37;
  --brand: #087a4f;          /* primary action */
  --brand-soft: #e3f3ea;
  --on-brand: #ffffff;
  --hero-ink: #ffffff;
  --hero-muted: #a9cbbb;
  --red: #c8202c;  --red-soft: #fdecee;
  --amber: #b86e00; --amber-soft: #fdf1dd;
  --blue: #1f63c4; --blue-soft: #e8f0fc;
  --ok: #187a45;
  --bar: #b4c6bd; --bar-recent: #087a4f;
  --map-bg: #e9f1ec; --map-road: #ffffff; --map-line: #087a4f;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --outer: #050c09; --bg: #0b1612; --surface: #13211b; --sunk: #182a22; --ink: #e6efea; --muted: #94a89e; --line: #23362d;
  --brand-deep: #041f18; --brand-mid: #083b2c; --brand: #22a86b; --brand-soft: #123528; --on-brand: #04130d;
  --hero-ink: #f1f7f4; --hero-muted: #8fb5a4;
  --red: #f0707a; --red-soft: #3a1a1e; --amber: #e9a640; --amber-soft: #3a2a12; --blue: #7aa9f0; --blue-soft: #16253d; --ok: #4fc483;
  --bar: #3d5248; --bar-recent: #22a86b; --map-bg: #102019; --map-road: #1b2e25; --map-line: #22a86b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --outer: #050c09; --bg: #0b1612; --surface: #13211b; --sunk: #182a22; --ink: #e6efea; --muted: #94a89e; --line: #23362d;
  --brand-deep: #041f18; --brand-mid: #083b2c; --brand: #22a86b; --brand-soft: #123528; --on-brand: #04130d;
  --hero-ink: #f1f7f4; --hero-muted: #8fb5a4;
  --red: #f0707a; --red-soft: #3a1a1e; --amber: #e9a640; --amber-soft: #3a2a12; --blue: #7aa9f0; --blue-soft: #16253d; --ok: #4fc483;
  --bar: #3d5248; --bar-recent: #22a86b; --map-bg: #102019; --map-road: #1b2e25; --map-line: #22a86b; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--outer); color: var(--ink); font: 15px/1.45 var(--font-body); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 440px; height: 100%; margin: 0 auto; background: var(--bg); display: grid; grid-template-rows: minmax(0, 1fr) auto; position: relative; }
@media (min-width: 480px) { .shell { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.screen { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.pad { padding-inline: 16px; }
.stack { display: grid; gap: 12px; padding-block: 14px 24px; }

/* ---------- hero (dark green, like the field-assist header) ---------- */
.hero { background: linear-gradient(160deg, var(--brand-deep), var(--brand-mid)); color: var(--hero-ink); padding: 18px 16px 22px; display: grid; gap: 12px; }
.hero .eyebrow { color: var(--hero-muted); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mark { display: flex; align-items: center; gap: 9px; font: 800 16px/1 var(--font-display); letter-spacing: .02em; }
.mark i { width: 26px; height: 26px; border-radius: 8px; background: var(--hero-ink); display: grid; place-items: center; }
.mark i::after { content: ""; width: 16px; height: 16px; background: var(--red);
  clip-path: polygon(50% 0%, 61.8% 36.2%, 100% 36.2%, 69.1% 58.6%, 80.9% 95.1%, 50% 72.6%, 19.1% 95.1%, 30.9% 58.6%, 0% 36.2%, 38.2% 36.2%); }
.hello { font: 700 20px/1.2 var(--font-display); }
.hero h1 { margin: 0; font: 800 28px/1.08 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.hero h1.id { font-size: 34px; letter-spacing: .02em; }
.hero .sub { color: var(--hero-muted); font-size: 14px; }
.chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
.chiprow.k4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hchip { background: rgba(255,255,255,.1); border-radius: 12px; padding: 7px 9px; display: grid; min-width: 0; }
.hchip b { font: 700 17px/1.15 var(--font-display); white-space: nowrap; }
.hchip small { color: var(--hero-muted); font-size: 11px; }
.hchip.risk-hi b { color: #ff9aa2; } .hchip.risk-mid b { color: #ffc970; } .hchip.risk-lo b { color: #8fe0b2; }
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--brand); }

.navbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border-radius: 14px; border: 0;
  background: var(--hero-ink); color: var(--brand-deep); font-weight: 700; text-decoration: none; font-size: 15px; }
.navbtn svg { width: 18px; height: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700; text-decoration: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > * { flex: 1 1 auto; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font: 700 16px/1.2 var(--font-display); }
.card .hint { margin: 0; color: var(--muted); font-size: 13px; }
.lift { margin-top: -10px; }

.tag { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.t-save { background: var(--red-soft); color: var(--red); } .t-protect { background: var(--blue-soft); color: var(--blue); }
.t-rescue { background: var(--amber-soft); color: var(--amber); } .t-monitor { background: var(--sunk); color: var(--muted); }
.t-route { background: var(--brand-soft); color: var(--brand); } .t-call { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.pill { font: 700 14px/1 var(--font-display); padding: 5px 8px; border-radius: 8px; white-space: nowrap; }
.p-hi { background: var(--red-soft); color: var(--red); } .p-mid { background: var(--amber-soft); color: var(--amber); } .p-lo { background: var(--brand-soft); color: var(--ok); }

/* progress */
.progress { display: grid; gap: 6px; }
.progress .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }

/* ---------- map ---------- */
.map svg { width: 100%; height: auto; display: block; border-radius: 12px; }
.map .bg { fill: var(--map-bg); }
.map .road { stroke: var(--map-road); stroke-width: 9; stroke-linecap: round; fill: none; }
.map .route { stroke: var(--map-line); stroke-width: 3; fill: none; stroke-linejoin: round; }
.map .route.back { stroke-dasharray: 5 5; opacity: .6; }
.map .pin circle { stroke: var(--surface); stroke-width: 2.5; }
.map .pin text { font: 700 11px var(--font-body); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.map .pin.done circle { fill: var(--ok); } .map .pin.next circle { fill: var(--red); } .map .pin.up circle { fill: var(--brand-mid); }
.map .depot rect { fill: var(--ink); } .map .depot text { fill: var(--bg); font: 700 9px var(--font-body); text-anchor: middle; dominant-baseline: central; }
.map .pin { cursor: pointer; }
.maplegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.maplegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* ---------- timeline ---------- */
.timeline { display: grid; }
.tl { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 12px; }
.tl .rail { position: relative; display: grid; justify-items: center; }
.tl .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl:first-child .rail::before { top: 18px; } .tl:last-child .rail::before { bottom: calc(100% - 18px); }
.tl .dot { position: relative; margin-top: 10px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font: 700 11px var(--font-body); background: var(--surface); border: 2px solid var(--bar); color: var(--muted); }
.tl.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl.next .dot { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 0 4px var(--red-soft); }
.tl.minor .dot { width: 12px; height: 12px; margin-top: 16px; border-width: 2px; }
.tl .body { padding-block: 6px; min-width: 0; }
.stop { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; }
.tl.next .stop { border-color: var(--red); }
.tl.done .stop { opacity: .7; }
.stop .r1 { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.stop .acc { font: 800 17px/1.1 var(--font-display); letter-spacing: .02em; }
.stop .why { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop .meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.minorline { padding-block: 10px 6px; color: var(--muted); font-size: 13px; }
.minorline b { color: var(--ink); font-weight: 600; }
.calllist { display: grid; gap: 6px; margin-top: 8px; }
.callrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; text-align: left; width: 100%; }
.callrow .acc { font: 700 15px var(--font-display); }
.callrow small { color: var(--muted); display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callrow > span:first-child { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; }
.callrow > .pill { flex: 0 0 auto; }
.callrow .acc { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ---------- reasons, facts, chart ---------- */
.reason { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; }
.reason .pts { font: 700 13px var(--font-display); color: var(--red); }
.reason .track { grid-column: 1 / -1; height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.reason .track i { display: block; height: 100%; background: var(--red); border-radius: 4px; opacity: .85; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; display: grid; gap: 1px; }
.stat small { color: var(--muted); font-size: 12px; font-weight: 600; }
.stat b { font: 800 22px/1.15 var(--font-display); }
.stat span { color: var(--muted); font-size: 12px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; font-weight: 600; }
.lines { display: flex; flex-wrap: wrap; gap: 5px; }
.lines span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); font-weight: 500; }
.lines span.dropped { background: var(--red-soft); color: var(--red); }
blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--red); background: var(--sunk); border-radius: 0 10px 10px 0; font-style: italic; font-size: 14px; }
.stars { color: var(--red); letter-spacing: 2px; }

/* action + brief */
.action { border: 0; background: linear-gradient(160deg, var(--brand-deep), var(--brand-mid)); color: var(--hero-ink); }
.action .eyebrow { color: var(--hero-muted); }
.action .what { margin: 0; font: 700 19px/1.25 var(--font-display); }
.action .offer { margin: 0; font-size: 14px; color: var(--hero-muted); }
.action .offer b { color: var(--hero-ink); }
.action .btn { background: rgba(255,255,255,.12); border-color: transparent; color: var(--hero-ink); }
.action .btn.primary { background: var(--hero-ink); color: var(--brand-deep); }
.brief { display: grid; gap: 10px; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font-size: 14px; }
.brief h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.brief p, .brief ol { margin: 0; } .brief ol { padding-left: 20px; display: grid; gap: 4px; }
.brief .src { font-size: 12px; color: var(--muted); }

/* checklist + outcome */
.check { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%; border: 0; background: none; padding: 6px 0; }
.check .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--bar); display: grid; place-items: center; color: transparent; font-weight: 800; font-size: 14px; }
.check[aria-pressed="true"] .box { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.check b { display: block; font-size: 14px; } .check span span { color: var(--muted); font-size: 13px; }
.outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.outcome { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; font-weight: 600; font-size: 14px; text-align: left; }
.outcome[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }

/* ---------- accounts list ---------- */
.listhead { position: sticky; top: 0; z-index: 3; background: var(--bg); display: grid; gap: 8px; padding-block: 12px 10px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.titlebar h1 { margin: 0; font: 800 24px/1.1 var(--font-display); }
.titlebar small { color: var(--muted); }
#q { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.sortrow { display: flex; align-items: center; gap: 8px; }
.sortrow label { font-size: 13px; color: var(--muted); font-weight: 600; flex: 0 0 auto; }
#sort { flex: 1 1 auto; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; }
.more { margin-top: 4px; }
.chip { flex: 0 0 auto; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand-deep); border-color: var(--brand-deep); color: #fff; }
.chip.f[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.chiplabel { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; flex: 0 0 auto; align-self: center; }
.rows { list-style: none; margin: 0; padding: 0 0 24px; display: grid; gap: 8px; }
.row { width: 100%; text-align: left; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.row .rk { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; font: 700 13px var(--font-display); color: var(--muted); }
.row .acc { font: 800 16px/1.1 var(--font-display); letter-spacing: .02em; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .why { grid-column: 2; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { grid-row: span 2; display: grid; justify-items: end; gap: 3px; }
.row .metric { font-size: 12px; color: var(--muted); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* ---------- top bar for pushed screens ---------- */
.topbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--brand-deep); color: var(--hero-ink); }
.topbar button { border: 0; background: rgba(255,255,255,.12); color: var(--hero-ink); border-radius: 10px; padding: 7px 11px; font-weight: 700; }
.topbar span { font-weight: 700; }

/* ---------- bottom tab bar ---------- */
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--brand); }
.tabbar .badge { position: relative; }
.tabbar .badge em { position: absolute; top: -4px; right: -10px; background: var(--red); color: #fff; font: 700 10px/1 var(--font-body); font-style: normal; padding: 3px 5px; border-radius: 999px; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 76px; background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 9; }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-block: 4px 8px; }
.linkbtn { border: 0; background: none; color: var(--brand); font-weight: 700; padding: 0; text-decoration: underline; }
</style>

<div class="shell" id="shell">
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button type="button" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.8"/></svg>
      Today
    </button>
    <button type="button" data-tab="next">
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg><em id="nextBadge" hidden></em></span>
      Next stop
    </button>
    <button type="button" data-tab="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Accounts
    </button>
  </nav>
  <div class="toast" id="toast" hidden></div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const META = DATA.meta, ROUTE = DATA.route, DEPOT = DATA.depot;
const W = DATA.words;
const ACCOUNTS = DATA.rows.map(r => {
  const a = {};
  DATA.cols.forEach((c, i) => { a[c] = r[i]; });
  for (const c of ["city", "state", "segment", "dropped_line", "action", "offer", "channel"]) a[c] = a[c] == null ? null : W[a[c]];
  a.reasons = a.reasons.map(([t, p]) => ({ text: W[t], points: p }));
  a.top_lines = a.top_lines.map(i => W[i]);
  return a;
});
const ACC = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));
const VISITS = ROUTE.stops;
const CALLS = { ids: ROUTE.calls };
const ON_ROUTE = Object.fromEntries(VISITS.map(v => [v.id, v]));
const ON_CALLS = new Set(CALLS.ids);

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "–" : "R$ " + Math.round(v).toLocaleString("en-US");
const moneyK = v => v == null ? "–" : v >= 1000 ? "R$ " + (v / 1000).toFixed(1) + "k" : "R$ " + Math.round(v);
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const line = s => String(s || "").replace(/_/g, " ");
const city = a => (a.city || "").replace(/\b\w/g, c => c.toUpperCase()).replace("Sao Paulo", "São Paulo");
const rc = r => r >= 0.40 ? "hi" : r >= 0.25 ? "mid" : "lo";
const SEG = { "1": ["Save now", "t-save"], "2": ["Rescue cheaply", "t-rescue"], "3": ["Protect", "t-protect"], "4": ["Monitor", "t-monitor"] };
const seg = a => SEG[a.segment[0]] || [a.segment, "t-monitor"];
const dur = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m} min`;

/* ---------- per-viewer day state (browser only) ---------- */
let day = { done: {}, checks: {} };
try { day = Object.assign(day, JSON.parse(localStorage.getItem("fieldline-day") || "{}")); } catch (e) {}
const saveDay = () => { try { localStorage.setItem("fieldline-day", JSON.stringify(day)); } catch (e) {} };
const isDone = id => !!day.done[id];
const nextVisit = () => VISITS.find(v => !isDone(v.id)) || null;

const PAGE = 50;
const state = { tab: "today", detail: null, sort: "priority", filter: "all", q: "", outcome: null, shown: PAGE };
const briefs = new Map();

/* ---------- navigation links (open the phone's maps app) ---------- */
const ll = p => `${p.lat},${p.lng}`;
const navTo = a => `https://www.google.com/maps/dir/?api=1&destination=${ll(a)}&travelmode=driving`;
function routeLink() {
  const left = VISITS.filter(v => !isDone(v.id)).map(v => ACC[v.id]);
  if (!left.length) return `https://www.google.com/maps/dir/?api=1&destination=${ll(DEPOT)}&travelmode=driving`;
  return `https://www.google.com/maps/dir/?api=1&origin=${ll(DEPOT)}&destination=${ll(DEPOT)}&waypoints=${left.map(ll).join("%7C")}&travelmode=driving`;
}
const NAV_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg>`;

/* ---------- shared pieces ---------- */
function reasonsHTML(a) {
  if (!a.reasons.length) return a.risk <= META.typical_risk ? `<p class="hint">Lower risk than a typical account (${pct(META.typical_risk)}). Nothing stands out.</p>` : `<p class="hint">No single fixable cause stands out; the extra risk comes mostly from the account's size and ordering rhythm.</p>`;
  const max = Math.max(...a.reasons.map(r => r.points || 0), 1);
  return a.reasons.map(r => `<div class="reason"><span>${esc(r.text)}</span><span class="pts num">+${r.points} pts</span>
    <span class="track"><i style="width:${Math.round(100 * r.points / max)}%"></i></span></div>`).join("") +
    `<p class="hint">A typical account has ${pct(META.typical_risk)} risk. The points show where this account's extra ${Math.round((a.risk - META.typical_risk) * 100)} points come from; account size and other factors make up the rest.</p>`;
}

function objective(a) {
  const t = a.reasons.map(r => r.text.toLowerCase()).join(" ");
  if (a.complaint || t.includes("review")) return "Recover the experience first, then agree the next order.";
  if (t.includes("late")) return "Restore confidence in delivery, then understand the slowdown.";
  if (t.includes("delivery cost")) return "Make ordering cheaper for them with fewer, bigger drops.";
  if (t.includes("product line")) return "Find out why a product line dropped and win it back.";
  return "Find out why ordering slowed and secure the next order.";
}

function checklist(a) {
  const r1 = a.reasons[0]?.text.toLowerCase() || "how things are going";
  return [
    ["Open", a.complaint ? "Acknowledge the recent complaint before anything else." : "Check in: how is business, how are our deliveries?"],
    ["Discover", `Ask about the main signal: ${r1}.`],
    ["Offer", a.offer],
    ["Agree", "Leave with one commitment: an order, a fix with an owner, or a date to follow up."],
  ];
}

/* ---------- map (drawn to scale from lat/lng) ---------- */
function mapSVG() {
  const pts = [DEPOT, ...VISITS.map(v => ACC[v.id])];
  const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length, k = Math.cos(lat0 * Math.PI / 180);
  const xs = pts.map(p => p.lng * k), ys = pts.map(p => -p.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = 340, H = 210, P = 22, sc = Math.min((W - 2 * P) / (maxX - minX || 1), (H - 2 * P) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  const X = p => ox + (p.lng * k - minX) * sc, Y = p => oy + (-p.lat - minY) * sc;
  const path = [DEPOT, ...VISITS.map(v => ACC[v.id])];
  const nv = nextVisit();
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of today's ${VISITS.length} stops in route order">
    <rect class="bg" width="${W}" height="${H}" rx="12"/>
    <path class="road" d="M-10 ${H * .62} C ${W * .3} ${H * .5}, ${W * .6} ${H * .78}, ${W + 10} ${H * .58}"/>
    <path class="road" d="M${W * .38} -10 C ${W * .44} ${H * .4}, ${W * .3} ${H * .7}, ${W * .36} ${H + 10}"/>
    <path class="road" style="stroke-width:6" d="M${W * .7} -10 L ${W * .78} ${H + 10}"/>
    <polyline class="route" points="${path.map(p => X(p).toFixed(1) + "," + Y(p).toFixed(1)).join(" ")}"/>
    <polyline class="route back" points="${X(path[path.length - 1]).toFixed(1)},${Y(path[path.length - 1]).toFixed(1)} ${X(DEPOT).toFixed(1)},${Y(DEPOT).toFixed(1)}"/>
    <g class="depot"><rect x="${X(DEPOT) - 6}" y="${Y(DEPOT) - 6}" width="12" height="12" rx="3"/><text x="${X(DEPOT)}" y="${Y(DEPOT) - 15}" style="fill:var(--ink)">Start</text></g>`;
  VISITS.forEach(v => {
    const a = ACC[v.id], cls = isDone(v.id) ? "done" : nv && nv.id === v.id ? "next" : "up";
    s += `<g class="pin ${cls}" data-open="${v.id}" tabindex="0" role="button" aria-label="Stop ${v.stop}, account ${v.id}"><circle cx="${X(a)}" cy="${Y(a)}" r="11"/><text x="${X(a)}" y="${Y(a)}">${isDone(v.id) ? "✓" : v.stop}</text></g>`;
  });
  return s + `</svg>`;
}

/* ---------- TODAY ---------- */
function renderToday() {
  const done = VISITS.filter(v => isDone(v.id)).length, nv = nextVisit();
  const varRoute = VISITS.reduce((s, v) => s + (ACC[v.id].value_at_risk || 0), 0);
  const minor = html => `<div class="tl minor"><div class="rail"><span class="dot"></span></div><div class="body">${html}</div></div>`;
  let rows = minor(`<div class="minorline"><b>Start</b></div>`);
  for (const s of VISITS) {
    const a = ACC[s.id], cls = isDone(s.id) ? "done" : nv && nv.id === s.id ? "next" : "";
    const [sl, sc] = seg(a);
    rows += `<div class="tl ${cls}"><div class="rail"><span class="dot">${isDone(s.id) ? "✓" : s.stop}</span></div>
      <div class="body"><button type="button" class="stop" data-open="${s.id}">
        <span class="r1"><span class="acc">${s.id}</span><span class="pill p-${rc(a.risk)} num">${pct(a.risk)}</span></span>
        <span class="why">${esc(a.reasons[0]?.text || a.action)}</span>
        <span class="meta"><span class="tag ${sc}">${sl}</span><span class="num">${s.drive_min} min drive · ${s.km} km</span>${isDone(s.id) ? `<span>${esc(day.done[s.id])}</span>` : ""}</span>
      </button></div></div>`;
  }
  rows += minor(`<div class="minorline"><b>Back</b> to start · ${ROUTE.return_min} min · ${ROUTE.return_km} km</div>`);
  const calls = `<section class="card"><h2>Calls today</h2><p class="hint">High risk with low revenue (Rescue cheaply) and low risk with high revenue (Protect). Save-now accounts get a visit instead.</p>
    <div class="calllist">${CALLS.ids.map(id => { const a = ACC[id]; return `<button type="button" class="callrow" data-open="${id}">
      <span><span class="acc">${id} <span class="tag ${seg(a)[1]}">${seg(a)[0]}</span></span><small>${esc(city(a))} · ${esc(a.reasons[0]?.text || "")}</small></span><span class="pill p-${rc(a.risk)} num">${pct(a.risk)}</span></button>`; }).join("")}</div></section>`;

  return `
  <header class="hero">
    <div class="brandrow"><span class="mark"><i></i>Fieldline</span><span class="sub">${esc(META.today)}</span></div>
    <div class="hello">Hello, ${esc(META.rep_name || "there")}</div>
    <div><div class="eyebrow">Today's route · São Paulo</div><h1>${done === VISITS.length ? "All visits done. Time for your calls." : nv ? `Next stop: ${nv.id}` : ""}</h1></div>
    <div class="chiprow k4">
      <div class="hchip"><b class="num">${done}/${VISITS.length}</b><small>visits</small></div>
      <div class="hchip"><b class="num">${dur(ROUTE.total_drive_min)}</b><small>driving</small></div>
      <div class="hchip"><b class="num">${ROUTE.total_km} km</b><small>distance</small></div>
      <div class="hchip"><b class="num">${moneyK(varRoute)}</b><small>at risk</small></div>
    </div>
    <a class="navbtn" href="${routeLink()}" target="_blank" rel="noopener">${NAV_ICON}${done ? "Continue route in Google Maps" : "Start route in Google Maps"}</a>
  </header>
  <div class="pad stack">
    <section class="card lift map"><div class="progress"><div class="top"><span>Day progress</span><span class="num">${done} of ${VISITS.length} visits</span></div><div class="bar"><i style="width:${100 * done / VISITS.length}%"></i></div></div>
      ${mapSVG()}
      <div class="maplegend"><span><i style="background:var(--red)"></i>next</span><span><i style="background:var(--brand-mid)"></i>upcoming</span><span><i style="background:var(--ok)"></i>done</span><span><i style="background:var(--ink);border-radius:2px"></i>start</span></div>
    </section>
    <section class="card"><h2>Stores to visit</h2><p class="hint">In driving order from the route planner.</p><div class="timeline">${rows}</div></section>
    ${calls}
    <p class="foot">© Fieldline 2026 ${done ? `<button type="button" class="linkbtn" id="resetDay">Reset day</button>` : ""}</p>
  </div>`;
}

/* ---------- NEXT STOP ---------- */
function renderNext() {
  const v = nextVisit();
  if (!v) {
    return `<header class="hero"><div class="brandrow"><span class="mark"><i></i>Fieldline</span><span class="sub">${esc(META.today)}</span></div>
      <div><div class="eyebrow">Visits complete</div><h1>All ${VISITS.length} visits done</h1><div class="sub">Next on the plan: your calls.</div></div></header>
      <div class="pad stack"><section class="card"><h2>Calls to make</h2>${CALLS.ids.map(id => { const a = ACC[id]; return `<button type="button" class="callrow" data-open="${id}"><span><span class="acc">${id}</span><small>${esc(a.reasons[0]?.text || "")}</small></span><span class="pill p-${rc(a.risk)} num">${pct(a.risk)}</span></button>`; }).join("")}</section></div>`;
  }
  const a = ACC[v.id], done = VISITS.filter(x => isDone(x.id)).length, [sl, sc] = seg(a);
  const checks = day.checks[a.id] || [];
  return `
  <header class="hero">
    <div class="brandrow"><span class="eyebrow">Next stop · ${v.stop} of ${VISITS.length}</span><span class="tag ${sc}">${sl}</span></div>
    <div><h1 class="id">${a.id}</h1><div class="sub">${esc(city(a))}, ${esc(a.state)}</div></div>
    <div class="chiprow k4">
      <div class="hchip"><b class="num">${v.drive_min} min</b><small>drive</small></div>
      <div class="hchip"><b class="num">${v.km} km</b><small>distance</small></div>
      <div class="hchip risk-${rc(a.risk)}"><b class="num">${pct(a.risk)}</b><small>churn risk</small></div>

    </div>
    <a class="navbtn" href="${navTo(a)}" target="_blank" rel="noopener">${NAV_ICON}Navigate to ${a.id}</a>
  </header>
  <div class="pad stack">
    <section class="card lift"><div class="progress"><div class="top"><span>Day progress</span><span class="num">${done} of ${VISITS.length} visits</span></div><div class="bar"><i style="width:${100 * done / VISITS.length}%"></i></div></div></section>
    <section class="card"><div class="eyebrow">Why you're visiting</div><h2>${esc(objective(a))}</h2>${reasonsHTML(a)}</section>
    ${actionCard(a)}
    <section class="card"><h2>Visit checklist</h2>
      ${checklist(a).map(([t, d], i) => `<button type="button" class="check" data-check="${i}" aria-pressed="${checks.includes(i)}"><span class="box">✓</span><span><b>${t}</b><span>${esc(d)}</span></span></button>`).join("")}
    </section>
    <section class="card"><h2>How did it go?</h2>
      <div class="outcomes">${["Order placed", "Issue logged", "Follow-up agreed", "Not available"].map(o => `<button type="button" class="outcome" data-outcome="${o}" aria-pressed="${state.outcome === o}">${o}</button>`).join("")}</div>
      <button type="button" class="btn primary block" id="complete" ${state.outcome ? "" : "disabled"}>Complete visit and go to next stop</button>
    </section>
    <button type="button" class="btn block" data-open="${a.id}">Full account overview</button>
  </div>`;
}

/* ---------- ACCOUNTS ---------- */
const SORTS = {
  priority: ["Priority", (a, b) => a.rank - b.rank, a => `#${a.rank} priority`],
  risk: ["Churn risk", (a, b) => b.risk - a.risk, a => `${pct(a.risk)} risk`],
  var: ["Value at risk", (a, b) => b.value_at_risk - a.value_at_risk, a => `${money(a.value_at_risk)} at risk`],
  revenue: ["Yearly revenue", (a, b) => b.annual_value - a.annual_value, a => `${money(a.annual_value)}/yr`],
  overdue: ["Most overdue", (a, b) => b.days_since_last / b.usual_gap_days - a.days_since_last / a.usual_gap_days, a => `${a.days_since_last}d silent · usual ${Math.round(a.usual_gap_days)}d`],
  silent: ["Last order", (a, b) => b.days_since_last - a.days_since_last, a => `${a.days_since_last} days ago`],
};
function renderAccounts() {
  const q = state.q.trim().toLowerCase();
  const list = ACCOUNTS.filter(a => state.filter === "all" || (state.filter === "route" ? ON_ROUTE[a.id] || ON_CALLS.has(a.id) : a.segment[0] === state.filter))
    .filter(a => !q || a.id.toLowerCase().includes(q) || (a.city || "").includes(q)).sort(SORTS[state.sort][1]);
  const segCount = k => ACCOUNTS.filter(a => a.segment[0] === k).length;
  const filters = [["all", "All"], ["route", "Today"], ["1", "Save now"], ["3", "Protect"], ["2", "Rescue cheaply"], ["4", "Monitor"]].filter(([k]) => !"1234".includes(k) || segCount(k));
  return `<div class="pad">
    <div class="listhead">
      <div class="titlebar"><h1>Accounts</h1><small class="num">${list.length.toLocaleString("en-US")} ${state.filter === "all" && !q ? "active accounts" : "shown"}</small></div>
      <input id="q" type="search" placeholder="Search account or city" autocomplete="off" value="${esc(state.q)}">
      <div class="sortrow"><label for="sort">Sort by</label><select id="sort">${Object.entries(SORTS).map(([k, [t]]) => `<option value="${k}" ${state.sort === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="chips" role="group" aria-label="Show">${filters.map(([k, t]) => `<button type="button" class="chip f" data-filter="${k}" aria-pressed="${state.filter === k}">${t}</button>`).join("")}</div>
    </div>
    <ul class="rows">${list.slice(0, state.shown).map((a, i) => {
      const [sl, sc] = seg(a), v = ON_ROUTE[a.id];
      const badge = v ? `<span class="tag t-route">Stop ${v.stop} today</span>` : ON_CALLS.has(a.id) ? `<span class="tag t-call">Call today</span>` : "";
      return `<li><button type="button" class="row" data-open="${a.id}">
        <span class="rk num">${i + 1}</span>
        <span class="acc">${a.id}<span class="tag ${sc}">${sl}</span>${badge}</span>
        <span class="side"><span class="pill p-${rc(a.risk)} num">${pct(a.risk)}</span><span class="metric num">${esc(SORTS[state.sort][2](a))}</span></span>
        <span class="why">${esc(city(a))} · ${esc(a.reasons[0]?.text || "No single clear reason")}</span>
      </button></li>`; }).join("") || `<li class="empty">No accounts match.</li>`}
      ${list.length > state.shown ? `<li class="more"><button type="button" class="btn block" id="more">Show ${Math.min(PAGE, list.length - state.shown)} more of ${(list.length - state.shown).toLocaleString("en-US")}</button></li>` : ""}</ul></div>`;
}

/* ---------- DETAIL ---------- */
function actionCard(a) {
  return `<section class="card action"><div class="eyebrow">Next best action</div><p class="what">${esc(a.action)}</p>
    <p class="offer">Offer: <b>${esc(a.offer)}</b>${a.dropped_line ? ` · win back <b>${esc(line(a.dropped_line))}</b>` : ""}</p>
    <div class="btnrow"><button type="button" class="btn primary" id="gen">${briefs.has(a.id) ? "Write again" : "Write call brief"}</button><button type="button" class="btn" id="copy" ${briefs.has(a.id) ? "" : "hidden"}>Copy</button></div>
    <div class="brief" id="brief" ${briefs.has(a.id) ? "" : "hidden"}>${briefs.has(a.id) ? briefHTML(briefs.get(a.id)) : ""}</div></section>`;
}
function renderDetail(id) {
  const a = ACC[id], [sl, sc] = seg(a), v = ON_ROUTE[id];
  const line = Math.min(180, Math.max(META.churn_days, Math.round(2 * a.usual_gap_days))), left = line - a.days_since_last, c = a.complaint;
  const late = a.late_share == null ? "–" : Math.round(a.late_share * 100) + "% late" + (a.last_order_late ? ", incl. the last one" : "");
  return `<div class="topbar"><button type="button" id="back">← Back</button><span>Account overview</span></div>
  <header class="hero">
    <div class="chiprow"><span class="tag ${sc}">${sl}</span><span class="tag t-route">#${a.rank} priority</span>${v ? `<span class="tag t-route">Today · stop ${v.stop}</span>` : ON_CALLS.has(id) ? `<span class="tag t-call">Call today</span>` : ""}</div>
    <div><h1 class="id">${a.id}</h1><div class="sub">${esc(city(a))}, ${esc(a.state)} · ${esc(a.channel)}</div></div>
    <a class="navbtn" href="${navTo(a)}" target="_blank" rel="noopener">${NAV_ICON}Navigate</a>
  </header>
  <div class="pad stack">
    <div class="stats lift">
      <div class="stat"><small>Churn risk, 90 days</small><b class="num" style="color:var(--${rc(a.risk) === "hi" ? "red" : rc(a.risk) === "mid" ? "amber" : "ok"})">${pct(a.risk)}</b><span>crosses its churn line within 90 days</span></div>
      <div class="stat"><small>Value at risk</small><b class="num">${money(a.value_at_risk)}</b></div>
      <div class="stat"><small>Yearly revenue</small><b class="num">${money(a.annual_value)}</b><span>last 12 months</span></div>
      <div class="stat"><small>Last order</small><b class="num">${a.days_since_last} days</b><span>usually every ${Math.round(a.usual_gap_days)} · ${left > 0 ? left + "d to churn line" : "past churn line"}</span></div>
    </div>
    ${actionCard(a)}
    <section class="card"><h2>Why this account is at risk</h2>${reasonsHTML(a)}
      <p class="hint"><b>Its own churn line: ${line} days.</b> This account usually orders every ${Math.round(a.usual_gap_days)} days, so it counts as churned after ${line} days without an order (2× its rhythm, at least ${META.churn_days} and at most 180). The risk is the chance it crosses that line in the next 90 days.</p></section>
    <section class="card"><h2>Account</h2><dl class="facts">
      <dt>Orders</dt><dd class="num">${a.n_orders} total · ${a.orders_last_90d ?? 0} in last 90 days (usually ${(a.usual_orders_per_90d ?? 0).toFixed(1)})</dd>
      <dt>Deliveries</dt><dd>${late}</dd>
      <dt>Delivery cost</dt><dd class="num">${a.freight_share == null ? "–" : Math.round(a.freight_share * 100) + "% of what it pays"}</dd>
      <dt>Reviews</dt><dd class="num">${a.avg_review == null ? "none yet" : a.avg_review.toFixed(1) + " / 5 average"}</dd>
    </dl></section>
    ${c ? `<section class="card"><h2>Most recent complaint</h2>
      <div><span class="stars" aria-label="${c.score} of 5 stars">${"★".repeat(c.score)}${"☆".repeat(5 - c.score)}</span> <span class="hint" style="display:inline">· ${c.days_ago} days ago · ${esc(c.theme)}</span></div>
      ${c.text || c.title ? `<blockquote lang="pt">${esc([c.title, c.text].filter(Boolean).join(" — "))}</blockquote><p class="hint">Original Portuguese. The call brief translates it.</p>` : `<p class="hint">Low score, no comment written.</p>`}</section>` : ""}
  </div>`;
}

/* ---------- call brief: Claude when available, template otherwise ---------- */
let samplePromise = null;
const getSample = () => (samplePromise ??= (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));
function facts(a) {
  return { account: a.id, city: a.city, churn_risk: a.risk, yearly_revenue: Math.round(a.annual_value), value_at_risk: Math.round(a.value_at_risk),
    days_since_last_order: a.days_since_last, usual_days_between_orders: Math.round(a.usual_gap_days),
    orders_last_90_days: a.orders_last_90d, usual_orders_per_90_days: a.usual_orders_per_90d,
    reasons: a.reasons.map(r => `${r.text} (+${r.points} pts)`), late_delivery_share: a.late_share, last_order_late: !!a.last_order_late,
    delivery_cost_share: a.freight_share, product_lines: a.top_lines.map(line), dropped_line: a.dropped_line && line(a.dropped_line),
    last_complaint: a.complaint && { stars: a.complaint.score, days_ago: a.complaint.days_ago, text_pt: [a.complaint.title, a.complaint.text].filter(Boolean).join(" — ") || null },
    visit_today: ON_ROUTE[a.id] ? `stop ${ON_ROUTE[a.id].stop} of ${VISITS.length} on today's route` : null,
    recommended_action: a.action, approved_offer: a.offer };
}
function prompt(a) {
  return `You prepare a field sales rep at a beverage supplier for a visit or call with an account (bar, restaurant or shop) that may stop ordering.
Use ONLY the facts below. Do not invent discounts or promises: the only offer allowed is "approved_offer".
Product line names come from a generic catalogue; refer to them as "your <name> line".
If there is a Portuguese complaint, translate it faithfully to English.

FACTS:
${JSON.stringify(facts(a), null, 1)}

Reply with only this JSON:
{"briefing": "2-3 sentences the rep can read in the car: what changed, the likely reason, what to offer",
 "complaint_en": "English translation of the complaint, or null",
 "opener": "first sentence, warm and specific",
 "questions": ["2-3 open questions to find out what changed"],
 "offer_pitch": "1-2 sentences pitching the approved offer",
 "close": "one sentence agreeing a concrete next step"}`;
}
function templateBrief(a) {
  const r = a.reasons.map(x => x.text.toLowerCase()), n = a.orders_last_90d ?? 0;
  return {
    briefing: `${a.id} has placed ${n} order${n === 1 ? "" : "s"} in the last 90 days, against a usual ${(a.usual_orders_per_90d ?? 0).toFixed(1)}. ${r.length ? "Main signals: " + r.slice(0, 2).join("; ") + "." : ""} Plan: ${a.action.toLowerCase()}. Offer: ${a.offer.toLowerCase()}.`,
    complaint_en: a.complaint?.text ? "(The translation needs the AI brief.)" : null,
    opener: a.complaint ? "I'm here because your last order didn't go the way it should, and I want to make that right." : "I wanted to check in: we haven't seen an order from you in a while, and I'd like to hear how things are going.",
    questions: ["How have our deliveries been for you lately?", a.dropped_line ? `I noticed you stopped ordering your ${line(a.dropped_line)} line. What changed there?` : "Has anything changed in what your customers are asking for?", "What would make ordering from us easier?"],
    offer_pitch: `To make it worth your while: ${a.offer.toLowerCase()}.`,
    close: "Shall I put your usual order together so you can confirm it today?", source: "template" };
}
function briefHTML(b) {
  return `<div><h3>Briefing</h3><p>${esc(b.briefing)}</p></div>
    ${b.complaint_en ? `<div><h3>Complaint in English</h3><p>${esc(b.complaint_en)}</p></div>` : ""}
    <div><h3>Script</h3><ol><li>${esc(b.opener)}</li>${(b.questions || []).map(q => `<li>${esc(q)}</li>`).join("")}<li>${esc(b.offer_pitch)}</li><li>${esc(b.close)}</li></ol></div>
    <p class="src">${b.source === "ai" ? "Written by Claude from this account's data, using only the approved offer." : "Template version. Open this app in Claude to have the brief written and the complaint translated by AI."}</p>`;
}
async function writeBrief(a) {
  const btn = $("#gen"), el = $("#brief");
  btn.disabled = true; el.hidden = false; el.innerHTML = `<p class="src">Writing the brief…</p>`;
  let b = null;
  const sample = await getSample();
  if (sample) { try { const out = await sample.json(prompt(a), { modelTier: "quick" }); if (out && out.briefing) b = { ...out, source: "ai" }; } catch (e) {} }
  b ??= templateBrief(a);
  briefs.set(a.id, b);
  const g = $("#gen"), box = $("#brief"), copy = $("#copy");
  if (box && currentAccountId() === a.id) { box.innerHTML = briefHTML(b); g.disabled = false; g.textContent = "Write again"; copy.hidden = false; }
}
async function copyBrief(a) {
  const b = briefs.get(a.id), btn = $("#copy"); if (!b) return;
  const text = [b.briefing, b.complaint_en && "Complaint: " + b.complaint_en, b.opener, ...(b.questions || []), b.offer_pitch, b.close].filter(Boolean).join("\n");
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#brief")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; }
  setTimeout(() => { if ($("#copy")) $("#copy").textContent = "Copy"; }, 1600);
}
const currentAccountId = () => state.detail || (state.tab === "next" ? nextVisit()?.id : null);

/* ---------- render + events ---------- */
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200); }
function render(keepScroll) {
  const scr = $("#screen"), top = scr.scrollTop;
  scr.innerHTML = state.detail ? renderDetail(state.detail) : state.tab === "today" ? renderToday() : state.tab === "next" ? renderNext() : renderAccounts();
  $("#tabbar").hidden = !!state.detail;
  document.querySelectorAll("#tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));
  const left = VISITS.filter(v => !isDone(v.id)).length, nb = $("#nextBadge"); nb.hidden = !left; nb.textContent = left;
  scr.scrollTop = keepScroll ? top : 0;
}
document.addEventListener("click", e => {
  const t = e.target;
  const open = t.closest("[data-open]"); if (open) { state.detail = open.dataset.open; render(); return; }
  const tab = t.closest("[data-tab]"); if (tab) { state.tab = tab.dataset.tab; state.detail = null; render(); return; }
  if (t.closest("#back")) { state.detail = null; render(); return; }
  const fi = t.closest("[data-filter]"); if (fi) { state.filter = fi.dataset.filter; state.shown = PAGE; render(true); return; }
  if (t.closest("#more")) { state.shown += PAGE; render(true); return; }
  const ck = t.closest("[data-check]"); if (ck) { const id = nextVisit().id, i = +ck.dataset.check, arr = day.checks[id] || []; day.checks[id] = arr.includes(i) ? arr.filter(x => x !== i) : [...arr, i]; saveDay(); render(true); return; }
  const oc = t.closest("[data-outcome]"); if (oc) { state.outcome = oc.dataset.outcome; render(true); return; }
  if (t.closest("#complete")) { const v = nextVisit(); if (!v || !state.outcome) return; day.done[v.id] = state.outcome; saveDay(); state.outcome = null; toast(`Stop ${v.stop} done: ${day.done[v.id]}`); render(); return; }
  if (t.closest("#gen")) { const id = currentAccountId(); if (id) writeBrief(ACC[id]); return; }
  if (t.closest("#copy")) { const id = currentAccountId(); if (id) copyBrief(ACC[id]); return; }
  if (t.closest("#resetDay")) { day = { done: {}, checks: {} }; saveDay(); render(); toast("Day reset"); return; }
});
document.addEventListener("keydown", e => { const p = e.target.closest?.(".pin"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.detail = p.dataset.open; render(); } });
document.addEventListener("change", e => { if (e.target.id === "sort") { state.sort = e.target.value; state.shown = PAGE; render(true); } });
document.addEventListener("input", e => { if (e.target.id === "q") { state.q = e.target.value; state.shown = PAGE; const pos = e.target.selectionStart; render(true); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
render();
</script>
